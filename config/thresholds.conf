# Alert thresholds configuration
# severity values: LOW, MEDIUM, HIGH, CRITICAL

# Minimum severity for terminal bell (BEL character)
terminal_bell=HIGH

# Minimum severity for desktop notification (notify-send)
desktop_notify=HIGH

# SSH attack detection
ssh_fail_count=5
ssh_fail_window=60
ssh_spray_usernames=8
ssh_success_after_fails=3
ssh_unusual_min_history=10

# Network connection bursts
conn_burst_count=12
conn_burst_window=10

# Enable/disable alert types
sound_enabled=true
notify_enabled=true
