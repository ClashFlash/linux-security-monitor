# Alert thresholds configuration
# severity values: LOW, MEDIUM, HIGH, CRITICAL

# Minimum severity for terminal bell (BEL character)
terminal_bell=HIGH

# Minimum severity for desktop notification (notify-send)
desktop_notify=HIGH

# SSH brute force detection
ssh_fail_count=5
ssh_fail_window=60

# Enable/disable alert types
sound_enabled=true
notify_enabled=true
